server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: dootask-backend

  # Temporarily disable database for testing
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisReactiveHealthContributorAutoConfiguration

  # Disable mail for now
  mail:
    host:
    port:
    username:
    password:

# Temporarily exclude all controllers except TestController
management:
  endpoints:
    web:
      exposure:
        include: "health,info"

logging:
  level:
    com.dootask.backend: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

knife4j:
  enable: true
  openapi:
    title: DooTask API
    description: DooTask Project Management System API
    version: 1.0.0